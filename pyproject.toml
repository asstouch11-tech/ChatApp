[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-app-client"
version = "1.0.0"
description = "Chat Desktop Client"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "cryptography>=42.0.0",
    "aiohttp>=3.9.1",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pyinstaller>=6.3.0",
]

[project.scripts]
chat-app = "secure_chat:main"

[tool.setuptools.packages.find]
where = ["python-client"]
include = ["secure_chat*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "UP", "B", "C4"]

[tool.black]
line-length = 100
target-version = ["py310"]